<style>

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:84px}

.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--ln)}.steps i.on{background:var(--or)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}

.err{color:#D13B3B;font-size:13px;margin:-6px 0 10px}a{color:var(--or)}
</style>

<script>

R.accueil=async function(){var L=await loadList();var c=CATS.map(function(a){return'<button class="cat" onclick="S.f.cat=\''+a[0]+'\';go(\'annonces\')"><span>'+a[1]+'</span>'+a[2]+'</button>'}).join("");
return'<div class="hero"><h1>Trouvez ou vendez vos projets facilement</h1><p>Annonces, projets, partenariats. Contact direct sur WhatsApp.</p><input id="hq" placeholder="Rechercher une annonce…" aria-label="Rechercher" style="margin-bottom:10px"><button class="btn" onclick="S.f.q=$(\'hq\').value;go(\'annonces\')">Rechercher</button></div><button class="btn ghost" onclick="go(\'publier\')">Publier mon projet</button><div class="cats">'+c+'</div>'+(L.length?'<h2>Annonces à la une et récentes</h2>'+L.slice(0,6).map(card).join(""):'<div class="box"><h3>Aucune annonce pour le moment</h3><p style="margin:0">Soyez le premier à publier votre projet.</p></div>')};

var r=L.filter(function(a){return(f.cat==="all"||a.category===f.cat)&&(f.obj==="all"||a.objective===f.obj)&&(!f.q||(a.title+" "+a.description).toLowerCase().indexOf(f.q.toLowerCase())>-1)});

return'<h2>Annonces</h2><input value="'+esc(f.q)+'" placeholder="Rechercher…" aria-label="Rechercher" onchange="S.f.q=this.value;render()"><div class="tabs">'+tabs+'</div><label>Objectif</label><select onchange="S.f.obj=this.value;render()"><option value="all">Tous</option>'+Object.keys(OBJ).map(function(k){return'<option value="'+k+'"'+(f.obj===k?' selected':'')+'>'+OBJ[k]+'</option>'}).join("")+'</select><p class="meta">'+r.length+' résultat'+(r.length>1?'s':'')+'</p>'+(r.length?r.map(card).join(""):'<div class="box">Aucune annonce ne correspond. Modifiez vos filtres ou <a href="#publier">publiez la vôtre</a>.</div>')};
R.annonce=async function(){var r=await sb.from("listings").select("*").eq("id",S.sel).maybeSingle();var a=r.data;if(!a)return'<div class="box">Cette annonce n’existe plus ou n’est plus visible.</div><button class="btn" onclick="go(\'annonces\')">Voir les annonces</button>';
var s=await sb.from("sellers").select("pseudo,created_at").eq("id",a.user_id).maybeSingle();
if(a.status==="published"&&!S.seen[a.id]){S.seen[a.id]=1;sb.rpc("increment_views",{p_listing:a.id})}
var rs='<select id="rr"><option value="arnaque">Arnaque</option><option value="faux_compte">Faux compte</option><option value="contenu_interdit">Contenu interdit</option><option value="doublon">Doublon</option><option value="autre">Autre</option></select>';
return'<button class="btn ghost sm" onclick="history.back()">← Retour</button><div class="th" style="width:100%;height:160px;font-size:64px;margin:12px 0">'+ic(a.category)+'</div><div>'+(fe(a)?'<span class="bd une">À la une</span>':'')+(a.is_verified?'<span class="bd ok">Vérifié</span>':'')+'<span class="bd">'+esc(OBJ[a.objective]||a.objective)+'</span>'+(a.status!=="published"?'<span class="bd">'+ST[a.status]+'</span>':'')+'</div><h2 style="margin-top:8px">'+esc(a.title)+'</h2><div class="price" style="font-size:22px">'+(a.price_xaf?fc(a.price_xaf):"À négocier")+'</div><p class="meta">'+esc(a.city)+' • '+a.views+' vues'+(s.data?' • Vendeur : '+esc(s.data.pseudo):'')+'</p><p style="white-space:pre-wrap">'+esc(a.description)+'</p><button class="btn wa" onclick="wa(\''+a.id+'\')">Contacter sur WhatsApp</button><div class="box" style="margin-top:12px"><label>Signaler cette annonce</label>'+rs+'<button class="btn ghost sm" onclick="rep(\''+a.id+'\')">Envoyer le signalement</button></div><div class="warn"><b>Soyez prudent.</b> Ne payez jamais à l’avance sans vérification. Dealio138 met en relation, mais n’intervient pas dans les transactions.</div>'};
async function wa(id){if(!need())return;var r=await sb.rpc("get_whatsapp",{p_listing:id});if(r.error){toast(em(r.error));return}var a=await sb.from("listings").select("title").eq("id",id).maybeSingle();var m=encodeURIComponent("Bonjour, je suis intéressé par votre annonce « "+(a.data?a.data.title:"")+" » sur Dealio138.");window.open("https://wa.me/"+r.data+"?text="+m,"_blank","noopener")}

R.tarifs=async function(){return'<h2>Nos tarifs</h2><p class="meta">Chaque formule s’achète une seule fois pour sa durée : pour continuer, rachetez-la à la fin.</p>'+PLANS.map(function(p){return'<div class="box plan'+(p.pop?' pop':'')+'"><div class="row"><h3>'+p.n+(p.pop?' <span class="bd une">Populaire</span>':'')+'</h3><span class="price">'+fc(p.p)+' / '+p.d+'</span></div><ul>'+p.f.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul><button class="btn'+(p.p?'':' ghost')+'" onclick="choose(\''+p.id+'\')">'+(p.p?'Choisir '+p.n:'Commencer gratuitement')+'</button></div>'}).join("")};

R.inscription=async function(){return'<h2>Créer un compte</h2><p class="meta">Rejoignez la communauté Dealio138.</p><label for="u">Pseudo</label><input id="u" autocomplete="nickname"><label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="ph">Téléphone WhatsApp</label><input id="ph" type="tel" placeholder="+237 6XX XX XX XX" autocomplete="tel"><label for="pw">Mot de passe (8 caractères minimum)</label><input id="pw" type="password" autocomplete="new-password"><label class="chk"><input id="c18" type="checkbox" onchange="ck()"> J’ai plus de 18 ans</label><label class="chk"><input id="cg" type="checkbox" onchange="ck()"> J’accepte les conditions d’utilisation et la politique de confidentialité</label><div class="err" id="er"></div><button class="btn" id="sb" disabled onclick="signup()">S’inscrire</button><p class="meta" style="text-align:center;margin-top:12px">Déjà un compte ? <a href="#connexion">Se connecter</a></p>'};
function ck(){$("sb").disabled=!($("c18").checked&&$("cg").checked)}
async function signup(){var u=$("u").value.trim(),e=$("e").value.trim(),p=$("pw").value,ph=$("ph").value.replace(/[^\d]/g,"");var m="";
if(u.length<3)m="Le pseudo doit contenir au moins 3 caractères.";else if(!/^\S+@\S+\.\S+$/.test(e))m="Entrez une adresse email valide.";else if(ph.length<9)m="Entrez un numéro WhatsApp valide, par exemple +237 6XX XX XX XX.";else if(p.length<8||!/\d/.test(p)||!/[a-zA-Z]/.test(p))m="Le mot de passe doit avoir 8 caractères minimum, avec des lettres et des chiffres.";

var r=await sb.auth.signUp({email:e,password:p,options:{data:{pseudo:u,phone:ph,is_adult:true,accepted_terms:true}}});
if(r.error){$("er").textContent=em(r.error);$("sb").disabled=false;return}
if(r.data.session){toast("Compte créé. Bienvenue "+u+" !");go(S.after||"accueil");S.after=null}else{$("v").innerHTML='<div class="box"><h2>Vérifiez votre email</h2><p>Nous avons envoyé un lien de confirmation à <b>'+esc(e)+'</b>. Cliquez dessus, puis connectez-vous.</p></div><button class="btn" onclick="go(\'connexion\')">Aller à la connexion</button>'}}
R.connexion=async function(){return'<h2>Connexion</h2><p class="meta">Connectez-vous à votre compte.</p><label for="le">Email</label><input id="le" type="email" autocomplete="username"><label for="lp">Mot de passe</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn" id="lb" onclick="login()">Se connecter</button><p class="meta" style="text-align:center;margin-top:12px">Pas encore de compte ? <a href="#inscription">S’inscrire</a></p>'};
async function login(){var e=$("le").value.trim(),p=$("lp").value;if(!e||!p){$("er").textContent="Entrez votre email et votre mot de passe.";return}$("lb").disabled=true;var r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error){$("er").textContent=em(r.error);$("lb").disabled=false;return}toast("Connexion réussie.");var n=S.after||"tableau";S.after=null;go(n)}
R.publier=async function(){if(!S.u){S.after="publier";return R.connexion()}var d=S.draft,s=d.step;
var h='<h2>Publier une annonce</h2><div class="steps"><i class="on"></i><i class="'+(s>1?'on':'')+'"></i><i class="'+(s>2?'on':'')+'"></i></div>';
if(s===1){h+='<p><b>Choisissez une catégorie</b></p><div class="cats" style="grid-template-columns:repeat(3,1fr)">'+CATS.map(function(a){return'<button class="cat" style="'+(d.c===a[0]?'border-color:var(--or);border-width:2px':'')+'" onclick="S.draft.c=\''+a[0]+'\';render()"><span>'+a[1]+'</span>'+a[2]+'</button>'}).join("")+'</div><label>Objectif</label><select id="do">'+Object.keys(OBJ).map(function(k){return'<option value="'+k+'"'+(d.o===k?' selected':'')+'>'+OBJ[k]+'</option>'}).join("")+'</select><div class="err" id="er"></div><button class="btn" onclick="if(!S.draft.c){$(\'er\').textContent=\'Choisissez une catégorie.\';return}S.draft.o=$(\'do\').value;S.draft.step=2;render()">Suivant</button>'}
else if(s===2){h+='<label for="dt">Titre de votre annonce</label><input id="dt" maxlength="60" value="'+esc(d.t)+'" placeholder="Ex : Compte TikTok 1M+"><label for="dd">Description (30 caractères minimum)</label><textarea id="dd" maxlength="3000" placeholder="Décrivez votre projet…">'+esc(d.d)+'</textarea><label for="dp">Prix (FCFA), laissez vide si à négocier</label><input id="dp" type="number" inputmode="numeric" value="'+esc(d.p)+'"><label for="dv">Ville</label><input id="dv" value="'+esc(d.v)+'" placeholder="Ex : Douala"><label for="dw">Numéro WhatsApp</label><input id="dw" type="tel" value="'+esc(d.w||(S.u.user_metadata||{}).phone||"")+'"><div class="err" id="er"></div><div class="row"><button class="btn ghost" onclick="S.draft.step=1;render()">Retour</button><button class="btn" onclick="nx2()">Suivant</button></div>'}
else{h+='<h3>Aperçu</h3>'+card({id:"",title:d.t,category:d.c,objective:d.o,price_xaf:+d.p||0,city:d.v})+'<div class="warn">Votre annonce sera vérifiée par notre équipe avant d’être publiée. Dealio138 n’intervient pas dans la transaction.</div><label class="chk"><input type="checkbox" id="dc"> Je comprends que Dealio138 n’intervient pas dans la transaction.</label><div class="err" id="er"></div><div class="row"><button class="btn ghost" onclick="S.draft.step=2;render()">Retour</button><button class="btn" id="pb" onclick="sub()">Envoyer pour validation</button></div>'}

function nx2(){var t=$("dt").value.trim(),d=$("dd").value.trim(),w=$("dw").value.replace(/[^\d]/g,"");var m="";if(t.length<5)m="Le titre doit contenir au moins 5 caractères.";else if(d.length<30)m="La description doit contenir au moins 30 caractères.";else if(!$("dv").value.trim())m="Indiquez la ville.";else if(w.length<9||w.length>15)m="Entrez un numéro WhatsApp valide.";
if(m){$("er").textContent=m;return}var D=S.draft;D.t=t;D.d=d;D.p=$("dp").value;D.v=$("dv").value.trim();D.w=w;D.step=3;render()}
async function sub(){if(!$("dc").checked){$("er").textContent="Cochez la case pour continuer.";return}$("pb").disabled=true;var D=S.draft;
var r=await sb.from("listings").insert({user_id:S.u.id,category:D.c,objective:D.o,title:D.t,description:D.d,price_xaf:D.p?+D.p:null,city:D.v,status:"pending_review"}).select("id").single();
if(r.error){$("er").textContent=em(r.error);$("pb").disabled=false;return}
var c=await sb.from("listing_contacts").insert({listing_id:r.data.id,whatsapp:D.w});
if(c.error){await sb.from("listings").delete().eq("id",r.data.id);$("er").textContent=em(c.error);$("pb").disabled=false;return}
S.draft={step:1};toast("Annonce envoyée. Elle sera publiée après vérification.");go("tableau")}
R.tableau=async function(){if(!S.u){S.after="tableau";return R.connexion()}
var q=await Promise.all([sb.from("listings").select("*").eq("user_id",S.u.id).order("created_at",{ascending:false}),sb.from("subscriptions").select("plan_id,ends_at").gt("ends_at",new Date().toISOString()).order("ends_at",{ascending:false}),sb.from("listing_clicks").select("id",{count:"exact",head:true})]);
var A=q[0].data||[],subs=q[1].data||[],clicks=q[2].count||0,order=["gratuit","basique","premium","pro"],best="gratuit",end=null;
subs.forEach(function(x){if(order.indexOf(x.plan_id)>order.indexOf(best)){best=x.plan_id;end=x.ends_at}});
var p=PLANS.filter(function(x){return x.id===best})[0],views=A.reduce(function(t,a){return t+a.views},0);
return'<h2>Tableau vendeur</h2><p class="meta">Connecté : '+esc(S.u.email)+(isStaff()?' • '+S.role:'')+'</p><div class="box" style="background:var(--nv);color:#fff"><div class="row"><div><b>Formule '+p.n+'</b><div style="font-size:13px;color:#C9D4EC">'+(end?'Jusqu’au '+new Date(end).toLocaleDateString("fr-FR"):'Annonce visible '+p.d)+'</div></div><button class="btn sm" onclick="go(\'tarifs\')">'+(end?'Renouveler':'Améliorer')+'</button></div></div><div class="stats"><div><b>'+A.length+'</b><span class="meta">Annonces</span></div><div><b>'+views+'</b><span class="meta">Vues</span></div><div><b>'+clicks+'</b><span class="meta">Clics WhatsApp</span></div></div><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Mes annonces</h3><button class="btn sm" onclick="go(\'publier\')">Publier</button></div>'+(A.length?A.map(function(a){var del=["draft","rejected","closed","expired"].indexOf(a.status)>-1;return'<div class="card" style="cursor:default"><div class="th">'+ic(a.category)+'</div><div style="flex:1"><h3>'+esc(a.title)+'</h3><div class="price">'+(a.price_xaf?fc(a.price_xaf):"À négocier")+'</div><span class="bd">'+ST[a.status]+'</span>'+(a.status==="published"?'<span class="meta">Expire le '+new Date(a.expires_at).toLocaleDateString("fr-FR")+'</span>':'')+(a.rejection_reason?'<div class="meta">Motif : '+esc(a.rejection_reason)+'</div>':'')+'<div style="margin-top:6px">'+(a.status==="published"||a.status==="pending_review"?'<button class="btn ghost sm" onclick="setSt(\''+a.id+'\',\'closed\')">Clôturer</button> ':'')+(del?'<button class="btn ghost sm" onclick="delAd(\''+a.id+'\')">Supprimer</button>':'')+'</div></div></div>'}).join(""):'<div class="box">Vous n’avez pas encore d’annonce. Publiez votre premier projet pour être vu par des acheteurs.</div>')+'<button class="btn ghost" style="margin-top:10px" onclick="logout()">Se déconnecter</button>'};
async function setSt(id,s){var r=await sb.from("listings").update({status:s}).eq("id",id);if(r.error)toast(em(r.error));else render()}
async function delAd(id){if(!confirm("Supprimer cette annonce définitivement ?"))return;var r=await sb.from("listings").delete().eq("id",id);if(r.error)toast(em(r.error));else render()}
async function logout(){await sb.auth.signOut();toast("Vous êtes déconnecté.");go("accueil")}
R.admin=async function(){if(!isStaff())return'<div class="box">Cette page est réservée à l’équipe Dealio138.</div>';
var q=await Promise.all([sb.from("listings").select("*").eq("status","pending_review").order("created_at"),sb.from("reports").select("*,listings(title,status)").eq("status","open").order("created_at")]);
var P=q[0].data||[],Rp=q[1].data||[];
return'<h2>Administration</h2><h3>Annonces à valider ('+P.length+')</h3>'+(P.length?P.map(function(a){return'<div class="box"><h3>'+esc(a.title)+'</h3><div class="meta">'+esc(a.category)+' • '+esc(OBJ[a.objective]||a.objective)+' • '+esc(a.city)+' • '+(a.price_xaf?fc(a.price_xaf):"À négocier")+'</div><p style="white-space:pre-wrap">'+esc(a.description)+'</p><div class="row"><button class="btn sm" onclick="appr(\''+a.id+'\')">Approuver</button><button class="btn ghost sm" onclick="rejt(\''+a.id+'\')">Refuser</button></div></div>'}).join(""):'<div class="box">Aucune annonce en attente.</div>')+'<h3 style="margin-top:16px">Signalements ouverts ('+Rp.length+')</h3>'+(Rp.length?Rp.map(function(x){return'<div class="box"><b>'+esc(x.listings?x.listings.title:"Annonce supprimée")+'</b><div class="meta">Motif : '+esc(x.reason)+'</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="susp(\''+x.listing_id+'\',\''+x.id+'\')">Suspendre l’annonce</button><button class="btn ghost sm" onclick="ign(\''+x.id+'\')">Ignorer</button></div></div>'}).join(""):'<div class="box">Aucun signalement.</div>')};
async function appr(id){var r=await sb.rpc("approve_listing",{p_id:id});toast(r.error?em(r.error):"Annonce publiée.");render()}
async function rejt(id){var m=prompt("Motif du refus (visible par le vendeur) :");if(!m)return;var r=await sb.rpc("reject_listing",{p_id:id,p_reason:m});toast(r.error?em(r.error):"Annonce refusée.");render()}
async function susp(l,rp){var m=prompt("Motif de la suspension :");if(!m)return;var r=await sb.rpc("suspend_listing",{p_id:l,p_reason:m});if(r.error){toast(em(r.error));return}await sb.from("reports").update({status:"actioned",handled_by:S.u.id}).eq("id",rp);toast("Annonce suspendue.");render()}
async function ign(rp){var r=await sb.from("reports").update({status:"dismissed",handled_by:S.u.id}).eq("id",rp);toast(r.error?em(r.error):"Signalement ignoré.");render()}
async function loadUser(ses){S.u=ses?ses.user:null;S.role="member";if(S.u){var r=await sb.from("profiles").select("role").eq("id",S.u.id).maybeSingle();if(r.data)S.role=r.data.role}render()}
async function render(){var r=location.hash.slice(1)||"accueil";if(!R[r])r="accueil";var tok=render.n=(render.n||0)+1;
var hb=$("hb");hb.textContent=S.u?(isStaff()?"Admin":"Mon espace"):"Connexion";hb.onclick=function(){go(S.u?(isStaff()?"admin":"tableau"):"connexion")};
var n=[["accueil","🏠","Accueil"],["annonces","📋","Annonces"],["publier","➕","Publier"],["tarifs","💳","Tarifs"],["tableau","👤","Compte"]];if(isStaff())n.push(["admin","🛡️","Admin"]);
$("nav").innerHTML=n.map(function(a){return'<button class="'+(a[0]===r?'on':'')+'" onclick="go(\''+a[0]+'\')"><span>'+a[1]+'</span>'+a[2]+'</button>'}).join("");
var h;try{h=await R[r]()}catch(e){h='<div class="box">Impossible de charger cette page. Vérifiez votre connexion et réessayez.</div>'}
if(tok!==render.n)return;$("v").innerHTML=h;window.scrollTo(0,0)}
window.addEventListener("hashchange",render);
sb.auth.onAuthStateChange(function(ev,ses){setTimeout(function(){loadUser(ses)},0)});
</script>
