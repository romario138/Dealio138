function tr(t){if(LANG!=="en"||!t)return t;var k=t.trim();if(!k)return t;var v=D[k];if(v===undefined){for(var i=0;i<P.length;i++){var m=k.match(P[i][0]);if(m){v=P[i][1].apply(null,m);break}}}return v===undefined?t:t.replace(k,function(){return v})}
function trTree(n){if(LANG!=="en")return;if(n.nodeType===3){var v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}if(n.nodeType!==1)return;["placeholder","aria-label"].forEach(function(a){if(n.hasAttribute(a)){var x=n.getAttribute(a),y=tr(x);if(y!==x)n.setAttribute(a,y)}});for(var c=n.firstChild;c;c=c.nextSibling)trTree(c)}
new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==="characterData")trTree(m.target);else m.addedNodes.forEach(trTree)})}).observe(document.body,{childList:true,subtree:true,characterData:true});

R.conseils=async function(){var B=L(["Ne payez jamais à l’avance sans avoir vérifié le projet.","Exigez une preuve de propriété : accès au compte, capture des statistiques, code temporaire dans la bio. Privilégiez les annonces avec le badge Vérifié.","Faites un appel vidéo ou rencontrez le vendeur avant de conclure.","Méfiez-vous des prix trop beaux pour être vrais et de la pression (« répondez vite, dernière chance »).","Vérifiez les chiffres annoncés (abonnés, revenus, trafic) avec des captures datées et un accès en lecture.","Payez en plusieurs étapes : un acompte raisonnable, puis le solde une fois le transfert du projet confirmé.","Faites un accord écrit (message WhatsApp ou PDF) qui indique ce qui est vendu, le prix et la date.","Ne partagez jamais votre mot de passe, un code SMS ou votre code secret Mobile Money."],["Never pay in advance without checking the project.","Ask for proof of ownership: account access, a screenshot of the statistics, a temporary code in the bio. Prefer listings with the Verified badge.","Make a video call or meet the seller before closing the deal.","Beware of prices that are too good to be true and of pressure (“reply fast, last chance”).","Check the announced figures (followers, revenue, traffic) with dated screenshots and read-only access.","Pay in several steps: a reasonable deposit, then the balance once the transfer of the project is confirmed.","Make a written agreement (WhatsApp message or PDF) stating what is sold, the price and the date.","Never share your password, an SMS code or your Mobile Money secret code."]);
